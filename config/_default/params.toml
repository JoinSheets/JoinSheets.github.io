# Single doc tree under content/docs/ -- each subsection (quick-start, user-guide,
# cookbook, developers, advanced-course) is its own sidebar nav inside it.
docSections = ["docs"]

uniqueHomePage = true   # homepage is a custom landing page, not a doc list

# The product repo, not this site's own repo -- linked from the footer (see
# layouts/_partials/footer.html), not from the theme's own nav icon slot
# ($config.source, which we leave unset): the main menu stayed GitHub-free on
# purpose, so this is the one way to reach the source from any page.
repo = "https://github.com/JoinSheets/JoinSheets"

enableDarkMode = false
defaultLightingMode = "auto"

# static/css/custom.css -- a plain static file, not run through Hugo's asset
# pipeline, so its URL never changes between deploys and GitHub Pages'/the
# browser's cache can keep serving an old copy for a while after an edit
# (confirmed: cache-control: max-age=600 on this path). Bump the ?v= query
# by one on every edit to this file, so the URL itself changes and caches
# can't paper over a real update.
customCSS = ["/css/custom.css?v=2"]

[search]
on = false   # turned off for the stub phase -- not enough content yet to search

[author]
name = "A1ex Ma"
url = "https://github.com/A1eksMa"

# logo-13-venn-p4-outline.svg out of design/logos/ (20 drafts, not part of
# the build -- see design/logos/README.md). Both modes still point at the
# same file; split lightMode/darkMode if the outline turns out too faint on
# a dark background.
[logo]
lightMode = "/images/logo.svg"
darkMode = "/images/logo.svg"
